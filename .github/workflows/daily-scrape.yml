name: Daily vacancy scrape

# Runs autonomous Python/Playwright adapters; Sber is explicitly opt-in in CI.
# Commits public/online_scraped.json back to main so GitHub Pages picks it up.
#
# Secrets expected (all optional — missing ones degrade gracefully):
#   GOOGLE_STORAGE_STATE_B64  — base64(storage_state.json) from authed careers.google.com
#   META_STORAGE_STATE_B64    — base64(storage_state.json) from authed metacareers.com
#
# To generate a storage state locally:
#   cd tools/cv_matcher
#   uv run playwright codegen --save-storage=google_state.json https://careers.google.com
#   base64 -i google_state.json -o google_state.b64  # copy contents into the GH secret

on:
  schedule:
    - cron: '0 7 * * *'      # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      sources:
        description: 'Adapters: yandex,google,meta,sber (Sber may be blocked in CI)'
        type: string
        default: 'yandex,google,meta'
      limit:
        description: 'Maximum vacancies per adapter query, 1–500'
        type: number
        default: 100

concurrency:
  group: daily-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tools/cv_matcher/uv.lock

      - name: Install Python deps
        working-directory: tools/cv_matcher
        run: uv sync --frozen

      - name: Install Playwright browsers + system deps
        working-directory: tools/cv_matcher
        run: uv run playwright install --with-deps chromium

      - name: Decode storage states
        working-directory: tools/cv_matcher
        env:
          GOOGLE_STATE_B64: ${{ secrets.GOOGLE_STORAGE_STATE_B64 }}
          META_STATE_B64: ${{ secrets.META_STORAGE_STATE_B64 }}
        run: |
          mkdir -p .auth
          if [ -n "$GOOGLE_STATE_B64" ]; then
            echo "$GOOGLE_STATE_B64" | base64 -d > .auth/google_state.json
            echo "GOOGLE_STORAGE_STATE=$GITHUB_WORKSPACE/tools/cv_matcher/.auth/google_state.json" >> "$GITHUB_ENV"
            echo "✓ Google storage_state loaded"
          else
            echo "⚠️ No GOOGLE_STORAGE_STATE_B64 — Google scrape will run unauthenticated"
          fi
          if [ -n "$META_STATE_B64" ]; then
            echo "$META_STATE_B64" | base64 -d > .auth/meta_state.json
            echo "META_STORAGE_STATE=$GITHUB_WORKSPACE/tools/cv_matcher/.auth/meta_state.json" >> "$GITHUB_ENV"
            echo "✓ Meta storage_state loaded"
          else
            echo "⚠️ No META_STORAGE_STATE_B64 — Meta scrape will run unauthenticated"
          fi

      - name: Run scraper
        id: scrape
        working-directory: tools/cv_matcher
        env:
          COLLECTION_SOURCES: ${{ inputs.sources || 'yandex,google,meta' }}
          COLLECTION_LIMIT: ${{ inputs.limit || '100' }}
        run: uv run python -u scripts/scrape_online.py --scrapers "$COLLECTION_SOURCES" --limit "$COLLECTION_LIMIT" 2>&1 | tee "$RUNNER_TEMP/vacancy-scrape.log"
        # don't fail the workflow on per-source errors; script returns 0
        continue-on-error: false

      - name: Prepare this run's vacancy export
        id: export
        if: ${{ !cancelled() && (steps.scrape.outcome == 'success' || steps.scrape.outcome == 'failure') }}
        working-directory: tools/cv_matcher
        run: python -m src.github_collection_export --target "$RUNNER_TEMP/vacancies-export"

      - name: Export vacancies for the local SQLite archive
        if: ${{ !cancelled() && steps.export.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: vacancies-export-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vacancies-export/online_scraped.json
          if-no-files-found: error
          retention-days: 14

      - name: Build vacancy tree
        working-directory: tools/cv_matcher
        run: uv run python scripts/build_vacancy_tree.py

      - name: Commit results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/online_scraped.json public/vacancy_tree.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          TOTAL=$(python3 -c "import json; d=json.load(open('public/online_scraped.json')); print(d.get('total',0))")
          git commit -m "chore(scrape): daily run — ${TOTAL} vacancies [skip ci]"
          # The portfolio publisher may advance main while scraping. Rebase
          # without forcing or overwriting concurrent edits to the same data.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Concurrent edits conflict with this export. Download vacancies-export from this run."
              exit 1
            fi
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "::error::Could not publish after 3 attempts. The vacancy artifact remains available for local import."
          exit 1

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: scrape-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vacancy-scrape.log
          if-no-files-found: ignore
          retention-days: 7
